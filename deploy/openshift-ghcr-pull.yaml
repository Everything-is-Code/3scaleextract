# GHCR pull secret — apply once before openshift.yaml (package is private).
#
# Option A — edit and apply this file:
#   Replace GITHUB_USER and GITHUB_PAT (PAT with read:packages).
#
# Option B — one-liner (recommended):
#   oc create secret docker-registry ghcr-pull -n threescale-export \
#     --docker-server=ghcr.io --docker-username=pcastelo \
#     --docker-password="$(gh auth token)"
---
apiVersion: v1
kind: Namespace
metadata:
  name: threescale-export
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: threescale-export
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "GITHUB_USER",
          "password": "GITHUB_PAT",
          "auth": ""
        }
      }
    }
