# threescale-export — OpenShift (no build on cluster)
#
# 1. cp deploy/threescale-cred.yaml.example deploy/threescale-cred.yaml  → fill Admin URL + PAT
# 2. oc apply -f deploy/threescale-cred.yaml
# 3. oc apply -f deploy/openshift.yaml
# 4. oc get route threescale-export -n threescale-export
#
# Image: ghcr.io/everything-is-code/threescale-export:latest (public GHCR package)
---
apiVersion: v1
kind: Namespace
metadata:
  name: threescale-export
  labels:
    app: threescale-export
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threescale-export
  namespace: threescale-export
  labels:
    app: threescale-export
spec:
  replicas: 1
  selector:
    matchLabels:
      app: threescale-export
  template:
    metadata:
      labels:
        app: threescale-export
    spec:
      securityContext:
        hostUsers: false
      containers:
        - name: export
          image: ghcr.io/everything-is-code/threescale-export:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: threescale-cred
          env:
            - name: THREESCALE_OUTPUT_DIR
              value: /export/data
            - name: THREESCALE_TOOLBOX_BINARY
              value: /opt/toolbox/bin/3scale
            - name: THREESCALE_INCLUDE_APPLICATIONS
              value: "true"
            - name: THREESCALE_REDACT_SECRETS
              value: "true"
            - name: THREESCALE_INSECURE_TLS
              value: "true"
            - name: FORCE_EXPORT
              value: "false"
          volumeMounts:
            - name: export-data
              mountPath: /export
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: export-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: threescale-export
  namespace: threescale-export
  labels:
    app: threescale-export
spec:
  selector:
    app: threescale-export
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: threescale-export
  namespace: threescale-export
  labels:
    app: threescale-export
spec:
  to:
    kind: Service
    name: threescale-export
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
