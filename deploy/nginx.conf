# OpenShift-friendly nginx: non-root, port 8080, no privileged paths.
# No "user" directive — runs as the container UID assigned by OpenShift.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    server {
        listen 8080 default_server;
        server_name _;

        root /export/www;
        index index.html;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /ready {
            access_log off;
            default_type text/plain;
            # Ready once export finished and index exists.
            if (!-f /export/www/index.html) {
                return 503 "export not ready\n";
            }
            return 200 "ready\n";
        }

        location /data/ {
            alias /export/data/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
