name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/Everything-is-Code/3scaleextract/internal/version.Version=${VERSION}"

          for bin in threescale-export threescale-seed threescale-visualize; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -ldflags="${ldflags}" -o "dist/${bin}" "./cmd/${bin}"
          done

          ( cd dist && tar czf "threescale-export-v${VERSION}-linux-amd64.tar.gz" threescale-export )
          ( cd dist && tar czf "threescale-seed-v${VERSION}-linux-amd64.tar.gz" threescale-seed )
          ( cd dist && tar czf "threescale-visualize-v${VERSION}-linux-amd64.tar.gz" threescale-visualize )

          ( cd dist && sha256sum threescale-export-v"${VERSION}"-linux-amd64.tar.gz > threescale-export-v"${VERSION}"-linux-amd64.tar.gz.sha256 )
          ( cd dist && sha256sum threescale-seed-v"${VERSION}"-linux-amd64.tar.gz > threescale-seed-v"${VERSION}"-linux-amd64.tar.gz.sha256 )
          ( cd dist && sha256sum threescale-visualize-v"${VERSION}"-linux-amd64.tar.gz > threescale-visualize-v"${VERSION}"-linux-amd64.tar.gz.sha256 )

          ./scripts/pack-export-minimal.sh
          cp testdata/export-minimal-1.0.tar.gz dist/
          cp testdata/export-minimal-1.0.tar.gz.sha256 dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/threescale-export-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            dist/threescale-export-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            dist/threescale-seed-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            dist/threescale-seed-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            dist/threescale-visualize-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            dist/threescale-visualize-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            dist/export-minimal-1.0.tar.gz
            dist/export-minimal-1.0.tar.gz.sha256
          body: |
            ## What's new in v${{ steps.version.outputs.tag }}

            ### threescale-visualize
            - **`--canvas`** — generate an interactive Cursor IDE topology canvas (`.canvas.tsx`) from any export: charts, product→backend graph, sortable product table with policy chains.
            - Improved auth inference from toolbox YAML and legacy proxy fields.
            - Parses `backend_usages.json` in both wrapped and top-level array formats.

            ### threescale-export
            - **Extended `--redact-secrets`** — redacts `provider_verification_key`, `client_id`, `app_id`; strips embedded credentials from OIDC issuer URLs; fails export if cleartext remains after redaction.
            - **`--strict`** — fail when product sidecars cannot be fetched.
            - Export manifest warnings for skipped sidecars.

            See [docs/VISUALIZE.md](https://github.com/${{ github.repository }}/blob/main/docs/VISUALIZE.md) and the [README Redaction section](https://github.com/${{ github.repository }}/blob/main/README.md#redaction).

            ---

            ## Download (clients)

            ### 1. Export a tenant

            ```bash
            tar xzf threescale-export-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            chmod +x threescale-export

            export THREESCALE_ADMIN_URL="https://tenant-admin.example.com"
            export THREESCALE_ACCESS_TOKEN="your-token"

            ./threescale-export \
              --output ./export \
              --include-applications \
              --redact-secrets
            ```

            Use `--redact-secrets` when sharing exports outside the tenant team. See [README — Run the binary](https://github.com/${{ github.repository }}#run-the-binary) for Docker/toolbox prerequisites.

            ### 2. Visualize (optional)

            ```bash
            tar xzf threescale-visualize-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            chmod +x threescale-visualize

            # Markdown report
            ./threescale-visualize ./export -o ./report

            # Report + Cursor topology canvas
            ./threescale-visualize ./export -o ./report --canvas ./topology.canvas.tsx
            ```

            Copy `topology.canvas.tsx` to `~/.cursor/projects/<workspace>/canvases/` and open it in Cursor. Full guide: [docs/VISUALIZE.md](https://github.com/${{ github.repository }}/blob/main/docs/VISUALIZE.md).

            ## Lab / demo (optional)

            - `threescale-seed-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz` — [docs/SEED.md](https://github.com/${{ github.repository }}/blob/main/docs/SEED.md)
            - `export-minimal-1.0.tar.gz` — offline fixture; [testdata/README.md](https://github.com/${{ github.repository }}/blob/main/testdata/README.md)
            - Demo canvas: [docs/examples/topology-demo.canvas.tsx](https://github.com/${{ github.repository }}/blob/main/docs/examples/topology-demo.canvas.tsx)

            ## Verification

            ```bash
            sha256sum -c threescale-export-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            sha256sum -c threescale-visualize-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            ```
