name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/Everything-is-Code/3scaleextract/internal/version.Version=${VERSION}"

          for platform in "linux amd64" "darwin arm64"; do
            set -- $platform
            GOOS=$1
            GOARCH=$2
            for bin in threescale-export threescale-seed threescale-visualize; do
              CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
                go build -ldflags="${ldflags}" -o "dist/${bin}" "./cmd/${bin}"
              ( cd dist && tar czf "${bin}-v${VERSION}-${GOOS}-${GOARCH}.tar.gz" "${bin}" )
              ( cd dist && sha256sum "${bin}-v${VERSION}-${GOOS}-${GOARCH}.tar.gz" > "${bin}-v${VERSION}-${GOOS}-${GOARCH}.tar.gz.sha256" )
            done
          done

          ./scripts/pack-export-minimal.sh
          cp testdata/export-minimal-1.0.tar.gz dist/
          cp testdata/export-minimal-1.0.tar.gz.sha256 dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/threescale-export-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            dist/threescale-export-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            dist/threescale-seed-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            dist/threescale-seed-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            dist/threescale-visualize-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            dist/threescale-visualize-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            dist/threescale-export-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz
            dist/threescale-export-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz.sha256
            dist/threescale-seed-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz
            dist/threescale-seed-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz.sha256
            dist/threescale-visualize-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz
            dist/threescale-visualize-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz.sha256
            dist/export-minimal-1.0.tar.gz
            dist/export-minimal-1.0.tar.gz.sha256
          body: |
            ## What's new in v${{ steps.version.outputs.tag }}

            ### Release packaging
            - **macOS Apple Silicon** — publish `*-darwin-arm64.tar.gz` (+ `.sha256`) for `threescale-export`, `threescale-seed`, and `threescale-visualize` alongside existing `*-linux-amd64.tar.gz` assets
            - **Docs** — downloads labeled by OS/arch; native Mac CLI still needs qemu/binfmt for the Red Hat `linux/amd64` toolbox image

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) and [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for flags and full release history.

            ---

            ## Download

            Assets are labeled by OS and architecture:

            | Platform | Archive suffix |
            |----------|----------------|
            | Linux amd64 | `*-linux-amd64.tar.gz` |
            | macOS Apple Silicon (darwin/arm64) | `*-darwin-arm64.tar.gz` |

            A native macOS CLI binary does **not** remove the need for a `linux/amd64` Red Hat toolbox image under qemu/binfmt (Docker Desktop or Podman machine) when using the containerized toolbox path.

            ### 1. Export a tenant (with metrics)

            **Linux amd64** (primary):

            ```bash
            tar xzf threescale-export-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            chmod +x threescale-export

            export THREESCALE_ADMIN_URL="https://tenant-admin.example.com"
            export THREESCALE_ACCESS_TOKEN="your-token"

            ./threescale-export \
              --output ./export \
              --include-applications \
              --include-metrics \
              --metrics-since 2026-01-01 \
              --metrics-until 2026-01-31 \
              --redact-secrets \
              --insecure
            ```

            **macOS Apple Silicon** (`darwin-arm64`):

            ```bash
            tar xzf threescale-export-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz
            chmod +x threescale-export
            # Same export flags as above. Toolbox still needs AMD64 emulation
            # (Docker Desktop / Podman machine qemu/binfmt) for the Red Hat image.
            ```

            Metrics only:

            ```bash
            ./threescale-export metrics \
              --output ./export \
              --metrics-since 2026-01-01 \
              --metrics-until 2026-01-31
            ```

            ### 2. Visualize (optional)

            ```bash
            tar xzf threescale-visualize-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz
            chmod +x threescale-visualize

            ./threescale-visualize ./export -o ./report
            ./threescale-visualize ./export -o ./report --html
            ```

            On Apple Silicon, use `threescale-visualize-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz` instead.

            Full guide: [docs/VISUALIZE.md](https://github.com/${{ github.repository }}/blob/main/docs/VISUALIZE.md).

            ## Lab / demo (optional)

            - `threescale-seed-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz` — [docs/SEED.md](https://github.com/${{ github.repository }}/blob/main/docs/SEED.md) (also `*-darwin-arm64.tar.gz` on Apple Silicon)
            - `export-minimal-1.0.tar.gz` — offline fixture
            - Demo HTML: [docs/examples/topology-demo.html](https://github.com/${{ github.repository }}/blob/main/docs/examples/topology-demo.html)

            ## Verification

            ```bash
            # After downloading the archive(s) for your platform:
            sha256sum -c threescale-export-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            sha256sum -c threescale-visualize-v${{ steps.version.outputs.tag }}-linux-amd64.tar.gz.sha256
            # Apple Silicon:
            # sha256sum -c threescale-export-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz.sha256
            # sha256sum -c threescale-visualize-v${{ steps.version.outputs.tag }}-darwin-arm64.tar.gz.sha256
            ```
