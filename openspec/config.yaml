schema: spec-driven

context: |
  Tech stack: Go 1.22, cobra CLI, no frontend build chain in repo.
  Architecture: threescale-export / threescale-seed / threescale-visualize;
  visualize loads on-disk exports (schema 1.0) and writes Markdown + optional artifacts.
  Testing: go test ./..., golangci-lint, 80% coverage gate.
  Style: internal/visualize packages; go:embed for templates; fixture data from export-minimal only.
  Privacy: no customer/tenant names in committed code, tests, or SDD examples.

rules:
  proposal:
    - Use export-minimal / seed_* fixtures in examples
    - No customer-specific paths or tenant names
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Reuse BuildCanvasData / shared topology payload for canvas, HTML, and Markdown catalog
  tasks:
    - Group by phase; keep tasks completable in one session
  apply:
    tdd: true
    test_command: "go test ./..."
  verify:
    test_command: "go test ./..."
    build_command: "go build ./cmd/threescale-visualize"
    coverage_threshold: 80
